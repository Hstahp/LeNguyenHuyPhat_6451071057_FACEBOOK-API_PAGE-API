groups:
  - name: kafka_alerts
    rules:
      # Theo tài liệu: kích hoạt NGAY (for: 0m) khi có message mới vào dead_letter
      - alert: DeadLetterQueueReceived
        expr: >
          increase(
            kafka_topic_partition_current_offset{topic="dead_letter"}[1m]
          ) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Co message moi vao Dead Letter Queue"
          description: >
            Topic dead_letter vua nhan them message.
            Kiem tra Kafka UI tai http://localhost:8080 de xem noi dung va xu ly thu cong.

      # Theo tài liệu: consumer lag > 500 trong 2 phút
      - alert: KafkaConsumerLagHigh
        expr: kafka_consumer_group_lag > 500
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Consumer lag cao bat thuong"
          description: >
            Consumer group {{ $labels.consumergroup }} dang lag {{ $value }} message
            tren topic {{ $labels.topic }}.

      # Theo tài liệu: không có event nào từ Facebook trong 10 phút
      - alert: WebhookReceiverSilent
        expr: >
          increase(
            kafka_topic_partition_current_offset{topic="raw_events"}[5m]
          ) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Khong co event nao tu Facebook trong 10 phut"
          description: >
            Topic raw_events khong co message moi.
            Kiem tra lai Facebook Webhook subscription.

      # Kafka broker down
      - alert: KafkaBrokerDown
        expr: up{job="kafka-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker is down"
          description: "Kafka exporter unreachable — broker may be offline"