services:
  # ── Kafka Infrastructure ────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: fb_api-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fb_api-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fb_api-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fb_api-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: fb_api-kafka-exporter
    depends_on:
      - kafka
    ports:
      - "9308:9308"
    command:
      - "--kafka.server=kafka:29092"

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: fb_api-postgres
    environment:
      POSTGRES_DB: fb_api_db
      POSTGRES_USER: fb_api_user
      POSTGRES_PASSWORD: fb_api_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fb_api_user -d fb_api_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Microservices ───────────────────────────────────────────────────────────
  webhook-service:
    build:
      context: ../services/webhook-service
      dockerfile: Dockerfile
    container_name: fb_api-webhook-service
    depends_on:
      - kafka
    ports:
      - "3001:3001"
    env_file:
      - ../services/webhook-service/.env
    environment:
      KAFKA_BROKERS: kafka:29092

  core-service:
    build:
      context: ../services/core-service
      dockerfile: Dockerfile
    container_name: fb_api-core-service
    depends_on:
      - kafka
    ports:
      - "3002:3002"
    env_file:
      - ../services/core-service/.env
    environment:
      KAFKA_BROKERS: kafka:29092

  retry-service:
    build:
      context: ../services/retry-service
      dockerfile: Dockerfile
    container_name: fb_api-retry-service
    depends_on:
      - kafka
    ports:
      - "3003:3003"
    env_file:
      - ../services/retry-service/.env
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_SEND_FAILED: send_failed
      KAFKA_TOPIC_SEND_RETRY: send_retry
      KAFKA_TOPIC_DEAD_LETTER: dead_letter

  backend-api:
    build:
      context: ../services/backend-api
      dockerfile: Dockerfile
    container_name: fb_api-backend-api
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ../services/backend-api/.env
    environment:
      KAFKA_BROKERS: kafka:29092
      POSTGRES_HOST: postgres
      KAFKA_TOPIC_SEND_FAILED: send_failed
      KAFKA_TOPIC_SEND_RETRY: send_retry

  # ── Monitoring ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: fb_api-prometheus
    depends_on:
      - kafka-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: fb_api-alertmanager
    depends_on:
      - prometheus
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

volumes:
  postgres_data: